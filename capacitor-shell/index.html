<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#faf9f7" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#1c1a18" media="(prefers-color-scheme: dark)" />
    <title>Mindful Movement</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #faf9f7;
        --card: #ffffff;
        --fg: #1f2028;
        --muted: #71717a;
        --border: #e9e7e3;
        --secondary: #f3f2ef;
        --primary: #86efac;
        --primary-fg: #1f2028;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #1c1a18;
          --card: #26241f;
          --fg: #f6f5f2;
          --muted: #a8a49c;
          --border: rgba(255, 255, 255, 0.1);
          --secondary: #302d28;
          --primary: #5fd694;
          --primary-fg: #1c1a18;
        }
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
        margin: 0;
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: calc(env(safe-area-inset-top) + 24px) 24px
          calc(env(safe-area-inset-bottom) + 24px);
        background: var(--bg);
        color: var(--fg);
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, system-ui,
          sans-serif;
        text-align: center;
      }
      .wrap {
        width: 100%;
        max-width: 25rem;
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 24px;
        padding: 32px 28px;
        animation: enter 0.35s ease-out both;
      }
      @keyframes enter {
        from {
          opacity: 0;
          transform: translateY(10px) scale(0.98);
        }
        to {
          opacity: 1;
          transform: none;
        }
      }
      .icon {
        width: 64px;
        height: 64px;
        margin: 0 auto 22px;
        display: flex;
        align-items: center;
        justify-content: center;
        border-radius: 999px;
        background: var(--secondary);
        color: var(--muted);
        animation: breathe 3.6s ease-in-out infinite;
      }
      .icon svg {
        width: 32px;
        height: 32px;
      }
      @keyframes breathe {
        0%,
        100% {
          transform: scale(1);
        }
        50% {
          transform: scale(1.06);
        }
      }
      h1 {
        font-size: 1.25rem;
        font-weight: 600;
        margin: 0 0 12px;
        letter-spacing: -0.01em;
      }
      p {
        font-size: 0.875rem;
        line-height: 1.6;
        margin: 0 auto 28px;
        max-width: 19rem;
        color: var(--muted);
      }
      button {
        appearance: none;
        border: 0;
        width: 100%;
        border-radius: 12px;
        background: var(--primary);
        color: var(--primary-fg);
        font: inherit;
        font-weight: 600;
        font-size: 0.9375rem;
        min-height: 48px;
        padding: 0 24px;
        cursor: pointer;
      }
      button:active {
        opacity: 0.85;
      }
      button.secondary {
        margin-top: 8px;
        background: transparent;
        color: var(--muted);
        font-weight: 500;
        font-size: 0.875rem;
      }
      @media (prefers-reduced-motion: reduce) {
        .wrap,
        .icon {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <div class="wrap" role="alertdialog" aria-labelledby="t" aria-describedby="d">
      <div class="icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M17.5 19H9a7 7 0 1 1 6.71-9" />
          <path d="M22 19a4 4 0 0 0-4-4h-1" />
          <line x1="2" y1="2" x2="22" y2="22" />
        </svg>
      </div>
      <h1 id="t"></h1>
      <p id="d"></p>
      <button type="button" id="retry"></button>
      <button type="button" class="secondary" id="settings"></button>
    </div>
    <script>
      var APP_URL = "https://mindfulmovement.lovable.app";
      var STRINGS = {
        en: {
          title: "Let's Get You Moving",
          message:
            "Mindful Movement needs an internet connection to load your personalized experience. Reconnect to continue your wellness journey.",
          retry: "Retry",
          settings: "Open Network Settings",
          loading: "Connection restored. Loading Mindful Movement...",
        },
        es: {
          title: "Regresemos a estar en movimiento",
          message:
            "Mindful Movement necesita conexión a internet para cargar tu experiencia personalizada. Vuelve a conectarte para continuar tu camino hacia una vida más saludable.",
          retry: "Reintentar",
          settings: "Abrir ajustes de red",
          loading: "Conexión restablecida. Cargando Mindful Movement...",
        },
      };
      function detectLang() {
        var stored = null;
        try {
          stored = window.localStorage.getItem("mm-lang");
        } catch (e) {}
        if (stored === "es" || stored === "en") return stored;
        var nav = (navigator.language || "en").toLowerCase();
        return nav.indexOf("es") === 0 ? "es" : "en";
      }
      var L = STRINGS[detectLang()];
      document.documentElement.lang = detectLang();
      document.getElementById("t").textContent = L.title;
      document.getElementById("d").textContent = L.message;
      document.getElementById("retry").textContent = L.retry;
      document.getElementById("settings").textContent = L.settings;
      function reload() {
        if (!navigator.onLine) {
          document.getElementById("d").textContent = L.stillOffline;
          return;
        }
        document.getElementById("d").textContent = L.loading;
        location.replace(APP_URL);
      }
      // Retry-loop protection: exponential backoff (3s -> 48s), and never
      // auto-retry while the device reports it is offline.
      var attempts = 0;
      var timer = null;
      function scheduleAutoRetry() {
        if (timer) clearTimeout(timer);
        var delay = Math.min(3000 * Math.pow(2, attempts), 48000);
        timer = setTimeout(function () {
          if (navigator.onLine) {
            attempts++;
            reload();
          }
          scheduleAutoRetry();
        }, delay);
      }
      scheduleAutoRetry();
      document.getElementById("retry").addEventListener("click", function () {
        attempts = 0;
        reload();
        scheduleAutoRetry();
      });
      document.getElementById("settings").addEventListener("click", function () {
        try {
          location.href =
            "intent://settings#Intent;action=android.settings.WIFI_SETTINGS;end";
        } catch (e) {
          reload();
        }
      });
      // Auto-recover as soon as the device is back online.
      window.addEventListener("online", function () {
        attempts = 0;
        reload();
      });
    </script>
  </body>
</html>
